name: 🐛 Bug Report
description: Create a report to help us improve Vocentra
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with Vocentra!
  - type: input
    id: version
    attributes:
      label: Vocentra Version / Environment
      description: What version or deployment URL are you using?
      placeholder: e.g. v1.0.0 / https://vocentra.netlify.app / Localhost
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what went wrong...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Speak or trigger '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: e.g. Chrome 124 on Windows 11, Safari on macOS Sonoma
    validations:
      required: false
